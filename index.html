<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e8684a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<script src="firebase-config.js"></script>
<style>
:root{--bg:#fbf6ef;--card:#fff;--ink:#2b2a33;--mut:#7a7684;--line:#eadfce;--accent:#e8684a;--accent2:#2f8f83;--r:16px}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{padding:20px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:1.5rem}
h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--mut)}
h2{font-size:1.05rem;margin:18px 0 8px}
main{max-width:720px;margin:0 auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:.85rem}
.dot{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.85rem;flex:none}
.dot.sm{width:22px;height:22px;font-size:.7rem}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;font:inherit;font-size:.72rem;color:var(--mut);padding:4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:10px}
nav button span{font-size:1.3rem}
nav button.on{color:var(--accent);font-weight:600}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
button.btn{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
button.btn.alt{background:var(--accent2)}
button.ghost{background:none;border:0;color:var(--mut);cursor:pointer;font-size:1.1rem;padding:4px 8px}
.form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.form input[type=text]{flex:1;min-width:140px}
.done .t{text-decoration:line-through;color:var(--mut)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.8rem;padding:0}
.done .chk{background:var(--accent2);border-color:var(--accent2)}
.pill{display:inline-block;background:#f3ebdd;border-radius:99px;padding:1px 9px;font-size:.78rem;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:22px 10px}
.banner{background:#fff3cd;border:1px solid #f0d98a;border-radius:12px;padding:10px 12px;margin:6px 14px;font-size:.88rem}
.board .msg{white-space:pre-wrap;word-break:break-word}
.score{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.score .card{min-width:110px;text-align:center;margin:0}
.big{font-size:1.5rem;font-weight:700}
.today{border-left:5px solid var(--accent)}
</style>
</head>
<body>
<header>
  <h1 id="title">Family Hub<small id="sub">Everyone, in one place</small></h1>
  <select id="me" title="Who are you?"></select>
</header>
<div id="banner"></div>
<main id="view"></main>
<nav id="nav"></nav>

<script>

const getCode=()=>{try{return localStorage.getItem('fh-code')||''}catch(e){return ''}};

      if(first&&snap.empty&&COLS.some(c=>S[c].length)){first=false;sync.pushAll();return}
      first=false;COLS.forEach(c=>{S[c]=next[c]});persist();sync.state='on';render();

  }catch(e){sync.state='error';banner('Could not start sharing: '+(e.message||e));render()}
}
const newCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('');

// ---- header / nav
function renderNav(){

  v.append(el('h2',{text:'Shopping list'}),el('div',{class:'card row'},el('div',{class:'grow',text:need?need+' item'+(need>1?'s':'')+' needed':'List is empty'}),el('button',{class:'btn alt',onclick:()=>{tab='shop';render()},text:'Open'})));

const CATS={event:['📌','Event'],birthday:['🎂','Birthday'],anniversary:['💍','Anniversary'],insurance:['🛡️','Insurance due'],rent:['🏠','Rent'],utilities:['💡','Utilities'],bill:['💳','Other payment']};
const MONEY=['insurance','rent','utilities','bill'];
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function matches(e,d){
  const [y,m,dd]=e.date.split('-').map(Number);
  if(ds(d)<e.date)return false;
  if(!e.repeat||e.repeat==='none')return ds(d)===e.date;
  const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const day=Math.min(dd,dim);
  if(e.repeat==='monthly')return d.getDate()===day;
  if(e.repeat==='yearly')return d.getMonth()+1===m&&d.getDate()===Math.min(dd,new Date(d.getFullYear(),m,0).getDate());

  for(let i=0;i<days;i++){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+i);S.events.forEach(e=>{if(matches(e,x))out.push(Object.assign({},e,{on:ds(x)}))})}
  return out.sort((a,b)=>(a.on+(a.time||'')).localeCompare(b.on+(b.time||'')));
}
const money=n=>n?(+n).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2}):'';

function vCal(){

  const rep=el('select');[['none','One time'],['monthly','Every month'],['yearly','Every year']].forEach(([k,l])=>rep.append(el('option',{value:k,text:l})));
  const w=memberSelect(true);

  v.append(el('div',{class:'form'},cat,t,d,tm,amt,rep,w,el('button',{class:'btn',text:'Add',onclick:()=>{if(!t.value.trim()||!d.value)return;save('events',{id:uid(),title:t.value.trim(),date:d.value,time:tm.value,who:w.value,cat:cat.value,amount:amt.value?+amt.value:0,repeat:rep.value});t.value='';amt.value=''}})));

  const tot=monthOcc.reduce((a,e)=>a+e.amount,0),left=monthOcc.filter(e=>e.on>=today()).reduce((a,e)=>a+e.amount,0);
  v.append(el('div',{class:'card'},el('div',{class:'mut',text:'This month\'s payments'}),el('div',{class:'big',text:'$'+money(tot)}),el('div',{class:'mut',text:'$'+money(left)+' still to pay · '+monthOcc.length+' items'})));

function choreRow(c){

function vChores(){

  [1,2,3,5].forEach(n=>p.append(el('option',{value:n,text:'⭐ '+n})));

function vShop(){

  v.append(imp);

function vBoard(){

function vFam(){

    v.append(el('div',{class:'card row'},dot(m.id),el('div',{class:'grow'},el('div',{text:m.name+(m.id===meId?' (you)':'')}),el('div',{class:'mut',text:ev+' upcoming · ⭐ '+pts})),el('button',{class:'ghost',text:'✕',onclick:()=>remove('members',m.id)})));
  });
  const code=getCode(),st={off:'Not shared (only on this phone)',noconfig:'Family code set, but firebase-config.js is not filled in',connecting:'Connecting…',on:'● Synced with family',error:'Sync error'}[sync.state];
  const ci=el('input',{type:'text',placeholder:'Enter family code',style:'flex:1'});
  const box=el('div',{class:'card'},el('div',{text:'Family sharing'}),el('div',{class:'mut',text:st}));
  if(code){box.append(el('div',{class:'big',style:'letter-spacing:2px',text:code}),el('div',{class:'mut',text:'Share this code. Everyone who joins sees the same hub.'}),
    el('div',{class:'form',style:'margin-top:8px'},el('button',{class:'btn alt',text:'Copy invite link',onclick:()=>{const u=location.origin+location.pathname+'#join='+code;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>banner('Invite link copied.'),()=>banner(u))}}),el('button',{class:'ghost',text:'Leave family',onclick:()=>{setCode('');location.reload()}})));
  }else{
    box.append(el('div',{class:'form',style:'margin-top:8px'},el('button',{class:'btn',text:'Create family code',onclick:()=>{setCode(newCode());location.reload()}})),el('div',{class:'form'},ci,el('button',{class:'btn alt',text:'Join',onclick:()=>{const c=ci.value.trim().toLowerCase();if(c.length<6)return;setCode(c);location.reload()}})));
  }
  v.append(box);
  const bm=el('div',{class:'mut'}),fi=el('input',{type:'file',accept:'.xlsx,.xls,.csv',style:'display:none'});
  fi.onchange=async()=>{const f=fi.files[0];if(!f)return;if(!confirm('Replace everything in the app with the contents of this file?'))return;try{bm.textContent='Restored: '+await importExcel(f)}catch(e){bm.textContent='Could not read the file: '+(e.message||e)}};
  v.append(el('div',{class:'card'},el('div',{text:'Backup (Excel)'}),el('div',{class:'mut',text:'Saves members, calendar, chores, shopping and board in one .xlsx file, one sheet each.'}),
    el('div',{class:'form',style:'margin-top:8px'},el('button',{class:'btn',text:'Download Excel backup',onclick:()=>exportExcel().catch(e=>{bm.textContent=e.message||e})}),el('button',{class:'btn alt',text:'Restore from Excel',onclick:()=>fi.click()}),fi),bm));
  return v;
}

// ---- Excel backup / restore
let xlsxP=null;
const loadXlsx=()=>xlsxP||(xlsxP=new Promise((ok,no)=>{if(window.XLSX)return ok(window.XLSX);const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>ok(window.XLSX);sc.onerror=()=>{xlsxP=null;no(new Error('Could not load the Excel library. Check your internet connection.'))};document.head.append(sc)}));
const nm=id=>(member(id)||{}).name||'';
async function exportExcel(){
  const X=await loadXlsx();const wb=X.utils.book_new();
  const add=(name,rows,cols)=>{const ws=X.utils.json_to_sheet(rows,{header:cols});ws['!cols']=cols.map(c=>({wch:Math.max(10,c.length+2)}));X.utils.book_append_sheet(wb,ws,name)};
  add('Members',S.members.map(m=>({ID:m.id,Name:m.name,Color:m.color})),['ID','Name','Color']);
  add('Calendar',[...S.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>({ID:e.id,Title:e.title,Category:(CATS[e.cat||'event']||CATS.event)[1],Date:e.date,Time:e.time||'',Repeat:e.repeat||'none',Amount:e.amount||0,Person:nm(e.who)})),['ID','Title','Category','Date','Time','Repeat','Amount','Person']);
  add('Chores',S.chores.map(c=>({ID:c.id,Chore:c.title,'Assigned to':nm(c.who),Points:c.points||1,Done:c.done?'yes':'no','Done by':nm(c.doneBy)})),['ID','Chore','Assigned to','Points','Done','Done by']);
  add('Shopping',S.shop.map(x=>({ID:x.id,Item:x.text,Bought:x.done?'yes':'no','Added by':nm(x.by)})),['ID','Item','Bought','Added by']);
  add('Board',[...S.posts].sort((a,b)=>a.ts-b.ts).map(p=>({ID:p.id,Message:p.text,By:nm(p.who),Time:new Date(p.ts).toISOString(),TS:p.ts})),['ID','Message','By','Time','TS']);
  X.writeFile(wb,'family-hub-backup-'+today()+'.xlsx');
}
async function importExcel(file){
  const X=await loadXlsx();const wb=X.read(await file.arrayBuffer(),{type:'array'});
  const rows=n=>wb.Sheets[n]?X.utils.sheet_to_json(wb.Sheets[n],{defval:''}):[];
  const dstr=v=>{if(typeof v==='number'){const p=X.SSF.parse_date_code(v);return p?p.y+'-'+pad(p.m)+'-'+pad(p.d):''}if(v instanceof Date)return ds(v);return String(v).slice(0,10)};
  const tstr=v=>{if(typeof v==='number'){const m=Math.round(v*1440);return pad(Math.floor(m/60)%24)+':'+pad(m%60)}return String(v||'').slice(0,5)};
  const members=rows('Members').filter(r=>r.Name).map((r,i)=>({id:String(r.ID||uid()),name:String(r.Name),color:r.Color||COLORS[i%COLORS.length]}));
  const byName=n=>{const m=members.find(x=>x.name.toLowerCase()===String(n||'').trim().toLowerCase());return m?m.id:''};
  const catKey=l=>Object.keys(CATS).find(k=>CATS[k][1].toLowerCase()===String(l).toLowerCase())||'event';
  const next={members,
    events:rows('Calendar').filter(r=>r.Title&&r.Date).map(r=>({id:String(r.ID||uid()),title:String(r.Title),cat:catKey(r.Category),date:dstr(r.Date),time:tstr(r.Time),repeat:['monthly','yearly'].includes(String(r.Repeat).toLowerCase())?String(r.Repeat).toLowerCase():'none',amount:+r.Amount||0,who:byName(r.Person)})),
    chores:rows('Chores').filter(r=>r.Chore).map(r=>({id:String(r.ID||uid()),title:String(r.Chore),who:byName(r['Assigned to']),points:+r.Points||1,done:String(r.Done).toLowerCase()==='yes',doneBy:byName(r['Done by'])||null})),
    shop:rows('Shopping').filter(r=>r.Item).map(r=>({id:String(r.ID||uid()),text:String(r.Item),done:String(r.Bought).toLowerCase()==='yes',by:byName(r['Added by'])})),
    posts:rows('Board').filter(r=>r.Message).map(r=>({id:String(r.ID||uid()),text:String(r.Message),who:byName(r.By),ts:+r.TS||Date.parse(r.Time)||Date.now()}))};
  COLS.forEach(c=>{S[c]=next[c]});persist();render();
  if(sync.pushAll)sync.pushAll().catch(e=>banner('Sync problem: '+(e.message||e)));
  return COLS.map(c=>next[c].length+' '+c).join(', ');
}
const VIEWS={home:vHome,cal:vCal,chores:vChores,shop:vShop,board:vBoard,fam:vFam};
function render(){
  const a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.value&&$('#view').contains(a))return; // don't wipe typing
  renderNav();renderMe();
  const m=$('#view');m.innerHTML='';m.append(VIEWS[tab]());
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==tab){tab=h;render()}});
render();
startSync();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
